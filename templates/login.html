<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>UPI Fraud Detection</title>
  <meta content="" name="description">
  <meta content="" name="keywords">

  <!-- Favicons -->
  <link href="../static/img/favicon.svg" rel="icon" type="image/svg+xml">
  <link href="../static/img/apple-touch-icon.svg" rel="apple-touch-icon" type="image/svg+xml">
  <meta name="theme-color" content="#0a0e27">

  <!-- Vendor CSS Files -->
  <link href="../static/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="../static/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">
  <link href="../static/vendor/boxicons/css/boxicons.min.css" rel="stylesheet">

  <!-- Modern Theme CSS -->
  <link href="../static/css/modern-theme.css" rel="stylesheet">

  <style>
    .login-card {
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: conic-gradient(from 0deg, transparent, var(--accent-cyan), var(--accent-magenta), transparent);
      animation: rotate 4s linear infinite;
      opacity: 0;
      transition: opacity 0.3s;
      z-index: 0;
    }

    .login-card:hover::before {
      opacity: 0.15;
    }

    @keyframes rotate {
      100% {
        transform: rotate(360deg);
      }
    }

    .login-card-inner {
      position: relative;
      z-index: 1;
      background: var(--bg-card);
      backdrop-filter: blur(20px);
      border-radius: var(--radius);
      padding: 3rem 2.5rem;
      border: 1px solid var(--border-glass);
    }

    .login-icon {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-magenta));
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      font-size: 1.8rem;
      color: white;
      box-shadow: 0 4px 20px rgba(0, 242, 255, 0.3);
    }
  </style>
</head>

<body>

  <!-- Preloader -->
  <div id="preloader"></div>

  <!-- Header -->
  <header id="header" class="fixed-top d-flex align-items-center">
    <div class="container-fluid container-xl d-flex align-items-center justify-content-lg-between">
      <h1 class="logo"><a href="{{ url_for('first') }}"><span>UPI</span> Fraud Detection</a></h1>

      <nav id="navbar" class="navbar order-last order-lg-0">
        <ul>
          <li><a class="nav-link" href="{{ url_for('first') }}">Home</a></li>
          <li><a class="nav-link active" href="{{ url_for('login') }}">Login</a></li>
          <li><a class="nav-link" href="{{ url_for('upload') }}">Upload</a></li>
          <li><a class="nav-link" href="{{ url_for('prediction1') }}">Check</a></li>
          <li><a class="nav-link" href="{{ url_for('chart') }}">Chart</a></li>
        </ul>
        <i class="bi bi-list mobile-nav-toggle"></i>
      </nav>
    </div>
  </header>

  <!-- Hero Section -->
  <section id="hero" class="d-flex align-items-center justify-content-center" style="min-height: 50vh;">
    <canvas id="particle-canvas"></canvas>
    <div class="container position-relative" style="z-index: 2;">
      <div class="row justify-content-center">
        <div class="col-lg-6">
          <div class="section-title" data-animate>
            <h2>Login</h2>
            <p>Secure access to the fraud detection dashboard</p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Login Form Section -->
  <section class="pb-5" style="margin-top: -100px; position: relative; z-index: 3;">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5" data-animate data-delay="200">
          <div class="login-card">
            <div class="login-card-inner">
              <div class="login-icon">
                <i class="bi bi-person-fill"></i>
              </div>
              <h3 class="text-center mb-4" style="font-family: var(--font-heading);">Welcome Back</h3>

              <div class="form-group mb-3">
                <label style="color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 0.5rem; display: block;">Username</label>
                <input type="text" id="uname" class="form-control" placeholder="Enter username">
              </div>

              <div class="form-group mb-4">
                <label style="color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 0.5rem; display: block;">Password</label>
                <input type="password" id="pwd" class="form-control" placeholder="Enter password">
              </div>

              <div class="d-grid">
                <button type="button" class="btn-primary w-100" onclick="login()">
                  <i class="bi bi-box-arrow-in-right"></i> Login
                </button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer id="footer">
    <div class="container">
      <div class="copyright">
        &copy; <strong><span>UPI Fraud Detection</span></strong>. All Rights Reserved.
      </div>
    </div>
  </footer>

  <a href="#" class="back-to-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>

  <!-- Vendor JS Files -->
  <script src="../static/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

  <!-- Modern Animations -->
  <script src="../static/js/animations.js"></script>

  <script>
    function login() {
      var uname = document.getElementById("uname").value;
      var pwd = document.getElementById("pwd").value;

      if (uname == "admin" && pwd == "admin") {
        alert("Login Success!");
        window.location = "{{ url_for('upload') }}";
        return false;
      } else {
        alert("Invalid Credentials!");
      }
    }
  </script>
</body>

</html>
